[package]
name = "utility-backend"
version = "0.1.0"
edition = "2021"
description = "Enterprise utility telemetry ingestion, tariff evaluation, and blockchain settlement backend"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic", "grpc-tonic"] }
thiserror = "2"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
ring = "0.17"
hex = "0.4"
sha2 = "0.11"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5"
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
tokio-rustls = "0.26"
url = "2"
fixed = { version = "1.23", features = ["serde"] }
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
tokio-stream = "0.1"
lru = "0.12"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
thread_local = "1"
rocksdb = "0.24"
p256 = { version = "0.14", features = ["ecdsa"] }
ecdsa = "0.17"
x509-cert = { version = "0.2", features = ["builder"] }
dcap-qvl = "0.5"
tonic = "0.11"
prost = "0.14"
prost-types = "0.12"
ciborium = "0.2"
criterion = { version = "0.5", optional = true }

[build-dependencies]
tonic-build = "0.11"
protobuf-src = "2.1"

[dev-dependencies]
axum-test = "16"
tempfile = "3"
proptest = "1"
criterion = "0.5"
rand = "0.8"

[features]
default = []

[lib]
name = "utility_backend"
path = "src/lib.rs"

[[bench]]
name = "parser_bench"
harness = false

[[test]]
name = "double_mint_prevention"
path = "tests/integration/double_mint_prevention.rs"

[[bench]]
name = "merkle_bench"
harness = false

[[bench]]
name = "stream_throughput"
harness = false
