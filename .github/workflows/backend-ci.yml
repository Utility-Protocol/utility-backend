name: backend-ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run pre-commit hook suite
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utility
          POSTGRES_PASSWORD: utility_secret
          POSTGRES_DB: utility_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run database migrations
        run: |
          PGPASSWORD=utility_secret psql -h localhost -U utility -d utility_test -f src/time_series/compress.sql
          PGPASSWORD=utility_secret psql -h localhost -U utility -d utility_test -f src/soroban/sync.sql
          PGPASSWORD=utility_secret psql -h localhost -U utility -d utility_test -f src/settlement/schema.sql
          PGPASSWORD=utility_secret psql -h localhost -U utility -d utility_test -f db/rate_limits.sql
          PGPASSWORD=utility_secret psql -h localhost -U utility -d utility_test -f db/audit_events.sql
        env:
          PGPASSWORD: utility_secret

      - name: Run unit and integration tests
        run: cargo test --all-features --verbose
        env:
          DATABASE_URL: postgres://utility:utility_secret@localhost:5432/utility_test

  perf-regression:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Restores the most recent baseline recorded from a push to `main`.
      # Cache entries are immutable per key in GitHub Actions, so main-branch
      # runs always save under a fresh (per-commit) key below; PR runs use
      # the `perf-baseline-` prefix to fall back to the most recent one.
      - name: Restore performance baseline
        uses: actions/cache/restore@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.sha }}
          restore-keys: |
            perf-baseline-

      - name: Run benchmarks
        run: cargo bench --all-features

      - name: Extract benchmark results
        run: python3 scripts/perf_regression_check.py extract --criterion-dir target/criterion --out current-perf.json

      - name: Compare against baseline (fails the build on a >10% regression)
        run: python3 scripts/perf_regression_check.py compare --baseline perf-baseline.json --current current-perf.json --threshold 0.10

      - name: Upload criterion HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 30

      - name: Record new baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        run: cp current-perf.json perf-baseline.json

      - name: Save performance baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ github.sha }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t utility-backend .
