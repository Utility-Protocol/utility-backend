name: Auto-assign on comment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    if: >
      contains(github.event.comment.body, 'assign me') ||
      contains(github.event.comment.body, 'I want to work on this') ||
      contains(github.event.comment.body, 'I''d like to work on this') ||
      contains(github.event.comment.body, 'can I work on this') ||
      contains(github.event.comment.body, 'I would like to work on this')
    steps:
      - name: Assign user to issue
        uses: actions/github-script@v6
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase();
            const assignee = context.payload.comment.user.login;
            
            if (comment.includes('assign me') || 
                comment.includes('i want to work on this') || 
                comment.includes("i'd like to work on this") ||
                comment.includes('can i work on this') ||
                comment.includes('i would like to work on this')) {
              
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [assignee]
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${assignee} has been assigned to this issue!`
              });
            }
