[compaction]
worker_count = 2
chunk_lease_ttl_ms = 5000
max_compaction_duration_s = 30
min_age_hours = 6

[clock_sync]
ntp_sample_interval_s = 30
max_correction_ppm = 500
cross_collector_sync_interval_s = 60

[identity]
attestation_enabled = true
crl_refresh_interval_s = 300
max_attestation_time_ms = 5000
[tracing.soroban_propagation]
enabled = true
poll_interval_ms = 500

[cache]
default_ttl_ms = 60000
max_entries = 10000
redis_url = "redis://127.0.0.1:6379/0"
namespace = "utility-backend"
