groups:
  - name: utility-backend-performance
    rules:
      - alert: CriticalPathP99LatencyBudgetBurn
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{path=~"/api/.*|/ingestion/.*|/settlement/.*"}[5m])) by (le, path)) > 0.1
        for: 10m
        labels:
          severity: page
          slo: critical-path-p99
        annotations:
          summary: "Critical path P99 latency is above 100ms"
          description: "{{ $labels.path }} has exceeded the 100ms P99 latency budget for 10 minutes. Start canary rollback analysis before widening rollout."
      - alert: PerformanceRegressionCanaryMismatch
        expr: avg_over_time(utility_canary_latency_regression_ratio[10m]) > 1.05
        for: 15m
        labels:
          severity: ticket
          slo: canary-performance
        annotations:
          summary: "Canary latency is more than 5% slower than stable"
          description: "The canary is breaching the CI regression threshold in production telemetry. Hold blue-green promotion and compare the latest Criterion baseline."
