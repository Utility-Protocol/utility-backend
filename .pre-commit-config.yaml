# Pre-commit quality gate for utility-backend.
# Install once with: pre-commit install --install-hooks
# Run all checks with: pre-commit run --all-files
minimum_pre_commit_version: '3.5.0'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: v1.23.6
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: cargo-test-fast
        name: cargo test (library and binaries)
        entry: cargo test --all-features --lib --bins
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: security-patterns
        name: repository security pattern scan
        entry: scripts/pre-commit-security.sh
        language: script
        pass_filenames: false
